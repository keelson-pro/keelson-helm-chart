apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keelson.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keelson.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- include "keelson.assertUnreserved" (dict "ctx" $ "user" . "kind" "labels" "field" "serviceAccount.labels") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    kaptain.org/project-name: keelson
    kaptain.org/version: "1.23"
    kaptain.org/owner: keelson-pro
  annotations:
    kaptain.org/source-repository: keelson-pro/keelson
    {{- with .Values.serviceAccount.annotations }}
    {{- include "keelson.assertUnreserved" (dict "ctx" $ "user" . "kind" "annotations" "field" "serviceAccount.annotations") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
