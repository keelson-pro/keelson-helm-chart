{{- range $foreignNamespace := uniq .Values.keelson.namespaces }}
{{- if ne $foreignNamespace $.Release.Namespace }}
---
# SPDX-License-Identifier: MIT
# Copyright (c) 2025-2026 Keelson contributors (Fred Cooke)

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "keelson.fullname" $ }}-foreign-ns-rbac
  namespace: {{ $foreignNamespace }}
  labels:
    {{- include "keelson.labels" $ | nindent 4 }}
    kaptain.org/project-name: keelson-foreign-ns-rbac
    kaptain.org/version: "1.2"
    kaptain.org/owner: keelson-pro
  annotations:
    kaptain.org/source-repository: keelson-pro/keelson-foreign-ns-rbac
subjects:
  # The subject is the ServiceAccount the core keelson install creates, which
  # lives in Keelson's own namespace, not in this one
  - kind: ServiceAccount
    name: {{ include "keelson.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "keelson.fullname" $ }}-foreign-ns-rbac
{{- end }}
{{- end }}
