apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keelson.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keelson.labels" . | nindent 4 }}
    kaptain.org/project-name: keelson
    kaptain.org/version: "1.23"
    kaptain.org/owner: keelson-pro
  annotations:
    kaptain.org/source-repository: keelson-pro/keelson
data:
  # Per-registry credential bindings. The map key is the registry host; by
  # convention, for auth-mode "secret" the Kubernetes Secret holding the
  # dockerconfigjson is named after the host (the map key itself). An optional
  # "namespace" field overrides the namespace the Secret is looked up in
  # (default: Keelson's own namespace).
  registries.yaml: |
    registries:
      {{- include "keelson.registries" . | nindent 6 }}
