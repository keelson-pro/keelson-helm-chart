# Keelson Helm chart values.
#
# Generated by the build in https://github.com/keelson-pro/keelson-helm-chart,
# from src/chart/values-header.yaml and the defaults of the pinned keelson
# release. Editing it in charts/keelson/values.yaml is pointless since it will
# be ovewritten on the next build and cause a PR failure if committed without
# the correct change to src/chart/values-header.yaml and other related files.
#
# Overriding it at install time is another matter, that's exactly what it's
# for. Edit a copy to reflect your needs, or use --set and friends to tune it.

# image.tag is REQUIRED and has no default. The tag encodes the bundled kubectl
# version, and kubectl only supports a +/-1 minor window either side of the API
# server, so no single default is correct for every cluster.
#
# Published tags:
#   https://github.com/keelson-pro/keelson-package/pkgs/container/keelson%2Fkeelson-package
#
# Check the server, then pick a tag whose kubectl minor is within one of it:
#   kubectl version -o yaml | grep -A2 serverVersion
#
# The tag must be on the same keelson line as this chart's appVersion, since the
# package and the manifests configuring it are released together. Rendering
# fails on a mismatch; set allowVersionMismatch to override deliberately.
image:
  registryAndNamespace: ghcr.io/keelson-pro
  name: keelson/keelson-package
  tag: ""
  allowVersionMismatch: false

nameOverride: ""
fullnameOverride: ""

# A registry Keelson reads tags from, for the central fallback below.
#
#   --set registry=registry.example.com
#
# This is YOUR registry, the one your workloads pull from. It is unrelated to
# image.* above, which is only where Keelson's own image comes from.
#
# Required while the default registries block below is in place, because that
# block names this host. Keelson checks each workload's own imagePullSecrets
# first, then its ServiceAccount's if keelson.respectServiceAccountPullSecrets
# is "true", and only then falls back to the central config. Where those already
# cover every registry, empty the registries block instead.
registry: ""

# The registries block written into registries.yaml in the ConfigMap.
#
# Keelson consults this only when a workload's own imagePullSecrets do not cover
# the registry, and its ServiceAccount's when keelson.respectServiceAccountPullSecrets
# is "true", which it is not by default. Set it to an empty string if they
# always do, and Keelson runs with no central config.
#
# Rendered as a Helm template, so the default below carries the {{ .Values.registry }}
# token and behaves like the Kaptain install: one registry, one auth mode. Replace
# the whole block with literal hosts to configure several.
#
# auth-mode is one of:
#   secret    a dockerconfigjson Secret, named after the host, in Keelson's own
#             namespace unless the entry adds a "namespace" field
#   aws-irsa  IAM Roles for Service Accounts (needs docker-credential-ecr-login)
#   azure-wi  Azure Workload Identity
#   gcp-wi    GCP Workload Identity
#
# Expanded example, no token, so no --set registry needed:
#
#   registries: |
#     registry.example.com:
#       auth-mode: secret
#     quay.io:
#       auth-mode: secret
#       namespace: platform-secrets
#     123456789012.dkr.ecr.eu-west-1.amazonaws.com:
#       auth-mode: aws-irsa
#     myregistry.azurecr.io:
#       auth-mode: azure-wi
#     europe-west1-docker.pkg.dev:
#       auth-mode: gcp-wi
registries: |
  {{ required "\n\nregistry is required while the default registries block is in place.\n\nSet the host your workloads pull from:\n  --set registry=registry.example.com\n\nOr replace this block with your own hosts. If your workloads already carry\nimagePullSecrets that cover every registry, Keelson needs no central config at\nall: set registries to an empty string to say so.\n  --set registries=\n" .Values.registry }}:
    auth-mode: {{ .Values.keelson.authMode }}


# Extra metadata on the ServiceAccount. Needed where the platform binds cloud
# identity to it rather than to the node:
#
#   serviceAccount:
#     annotations:
#       eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/keelson   # EKS IRSA
#       iam.gke.io/gcp-service-account: keelson@project.iam.gserviceaccount.com
#       azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
#     labels:
#       azure.workload.identity/use: "true"                                  # Azure WI
#
# Not required when ambient node credentials already cover the registry, which is
# the common case for aws-irsa on a node role with ECR read.
serviceAccount:
  annotations: {}
  labels: {}

# Pull secrets for Keelson's OWN image, for when you have retagged it into a
# private registry. Unrelated to `registries`, which is about the images Keelson
# watches.
#
#   imagePullSecrets:
#     - name: my-registry-creds
imagePullSecrets: []

# Standard pod placement and metadata passthroughs. All optional.
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# A CPU limit for Keelson, which you should not set.
#
# There is deliberately no CPU limit: throttling a controller that does bursty
# work against the API server and registries makes it slow at exactly the moment
# it has something to do, and the memory limit already bounds the pod. Requests
# are what the scheduler needs, and keelson.cpuRequest covers those.
#
# Set this only where a policy engine rejects pods that have no CPU limit, and
# then set it generously. Empty means no limit, which is the right answer.
forceCpuLimit: ""

# Two RBAC rules the chart cannot decide for you. Everything else follows a
# value it can read: a workload kind is granted only while keelson.watchedKinds
# names it, and the ServiceAccount read only while
# keelson.respectServiceAccountPullSecrets is on.
#
# Both are ceilings, not promises. Leaving one true permits the rule; it
# is still only rendered where Keelson could use it.
#
# allowSecretRead covers the dockerconfigjson Secrets named by workloads, by
# their ServiceAccounts, and by the registries block. Set it false only if every
# registry you use authenticates by cloud identity (aws-irsa, azure-wi, gcp-wi)
# and no workload carries imagePullSecrets. Left true with no namespaces listed,
# this is the widest grant in the chart: read any Secret in any namespace.
#
# allowJobCreate covers creating a Job from a CronJob, which Keelson does for
# suspended CronJobs used as on-demand tasks. Set it false if you keep none.
# Nothing is granted either way unless keelson.watchedKinds names CronJob.
rbac:
  allowSecretRead: true
  allowJobCreate: true

keelson:
  authMode: 'secret'
  configMode: 'keelson'
  cpuRequest: '100m'
  ephemeralStorage: '150Mi'
  fieldManagerStrategyOwned: 'mimic'
  fieldManagerStrategyUnowned: 'patch'
  firstPollDelayMax: '300'
  fullRefreshInterval: '86400'
  heartbeatMaxAge: '5'
  livenessProbeFailureThreshold: '5'
  livenessProbePeriodSeconds: '15'
  livenessProbeTimeoutSeconds: '6'
  logDebugRepeatInterval: '0'
  logErrorRepeatInterval: '600'
  logFileKeep: '5'
  logFileMaxBytes: '10485760'
  logFormat: 'plain'
  logInfoRepeatInterval: '120'
  logLevel: 'INFO'
  logManagedWorkloads: 'true'
  logWarnRepeatInterval: '300'
  memory: '270Mi'
  namespaces: []
  pollOverrunWarningBackoffLimit: '64'
  readinessProbeFailureThreshold: '2'
  readinessProbePeriodSeconds: '20'
  readinessProbeTimeoutSeconds: '5'
  reconcileInterval: '600'
  reconcileOverrunWarningBackoffLimit: '64'
  registryPollConcurrency: '2'
  registryPollIntervalDefault: '60'
  respectServiceAccountPullSecrets: 'false'
  rolloutWorkloadRefWarningBackoffLimit: '64'
  startupProbeFailureThreshold: '24'
  startupProbePeriodSeconds: '5'
  startupProbeTimeoutSeconds: '4'
  stateConfigMap: 'keelson-state'
  tickInterval: '1'
  watchedKinds:
    - Deployment
    - StatefulSet
    - DaemonSet
    - CronJob
  watcherReconnectInitial: '2'
  watcherReconnectMax: '60'
  watcherReconnectReset: '30'
  watcherRespawnBackoffMax: '300'
  watcherRespawnHealthyReset: '30'
